<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting…</title>
  <link rel="canonical" href="en/home.html">
  <script>
    (function() {
      const BASE_PATH = "/jortdeboer_web/";

      const lang = navigator.language || navigator.userLanguage;
      const shortLang = lang.slice(0, 2).toLowerCase();
      const supportedLangs = ['en', 'nl'];
      const targetLang = supportedLangs.includes(shortLang) ? shortLang : 'en';

      localStorage.setItem('prefLang', targetLang)
      window.location.href = `${BASE_PATH}${targetLang}/home.html`;
    })();
  </script>
</head>
<body>
  <p>If you are not redirected automatically, <a href="en/home.html">click here</a>.</p>
</body>
</html>
